# 정산 과목 기본 규칙 - 회사 계정 이름을 재무제표에 나오는 과목 이름으로 묶는다.
#
#   match   공백과 점을 뺀 계정 이름 전체에 맞는 정규식
#   big     대분류(자산 · 부채 · 자본 · 손익)
#   group   (선택) 공시 그룹이나 소분류가 이것일 때만 - 당좌자산 · 유동부채 · 판매비와관리비 …
#   except  (선택) 이름에 이 정규식이 있으면 건너뜀
#   settle  묶을 과목 이름
#
# 위에서부터 처음 맞는 규칙을 쓴다. 맞는 규칙이 없으면 회사 계정 이름 그대로다.
# 매출원가 아래 계정(원가명세서 계정)은 묶지 않는다.
# 여기에는 흔한 묶음만 둔다. 회사나 법인의 과목 체계는 이 파일을 본떠 따로 만들고
# `dsdxlsx tb --rules 파일` 이나 환경변수 DSDXLSX_SETTLE_RULES 로 준다.

[[rule]]
match = "정기예금|정기적금|정기예적금|단기금융상품"
big = "자산"
group = "당좌자산"
settle = "단기금융상품"

[[rule]]
match = "현금|현금성자산|현금및현금성자산"
big = "자산"
group = "당좌자산"
settle = "현금및현금성자산"

[[rule]]
match = ".*예금"
except = "정기|적금|장기|기타|보증|제한|담보|질권"
big = "자산"
group = "당좌자산"
settle = "현금및현금성자산"

[[rule]]
match = "외상매출금|받을어음|매출채권"
big = "자산"
group = "당좌자산"
settle = "매출채권"

[[rule]]
match = "외상매입금|지급어음|매입채무"
big = "부채"
settle = "매입채무"

[[rule]]
match = "이월이익잉여금|미처분이익잉여금"
big = "자본"
settle = "미처분이익잉여금"

[[rule]]
match = "이월결손금|미처리결손금"
big = "자본"
settle = "미처리결손금"

# '대손충당금(외상매출금)'처럼 괄호에 짝 자산을 붙인 차감 계정 - 괄호 안 이름을 위 규칙으로 묶는다.
[contra]
names = ["대손충당금", "감가상각누계액", "손상차손누계액", "정부보조금", "국고보조금", "현재가치할인차금"]
