# dsdxlsx 기본 검증 프로파일
#
# check.py 엔진이 쓰는 키워드·정규식·상수의 단일 소스. 값은 v1 하드코딩과
# 동일해야 한다(8개사 golden 회귀가 이를 고정). 회사별 편차는 이 파일을 고치지
# 말고 profiles/<회사명>/profile.toml 로 override 한다 — 여기 없는 키는 기본값.

[labels]
# 합계류 행 라벨 (정확 일치)
total = '^(합\s*계|소\s*계|총\s*계|계)$'
# '…총계'로 끝나는 행 (부채및자본총계 등)
grand_total = '총\s*계$'
# 가로합 대상 열 머리글
total_header = '^(합\s*계|총\s*계|계)$'
# 합계라는 단어 없는 결과 행 (차감후 금액·순액 — 주석8 퇴직급여 등)
deduct_total = '(차감후|공제후|순액$)'
# 흐름표의 결과 행 라벨 (소계 역할)
flow_end = '^(당기말|전기말|기말)'
# C5 대사에서 제외하는 일반 라벨 (문맥 없이는 같은 항목이라 볼 수 없음)
generic = [
    "합계", "소계", "계", "구분", "기타", "당기", "전기", "기초", "기말",
    "취득", "처분", "대체", "상각", "증가", "감소", "차감", "설정", "환입",
]

[periods]
# 열 머리글의 기간 버킷 판별 키워드 (부분 문자열 포함)
# 반기검토보고서 실측(2026-08): '당 반 기/전 반 기' 헤더 — 정규화 후 '당반기'
current = ["당분기", "당반기", "당기", "(당)"]
prior = ["전분기", "전반기", "전기", "(전)"]

[statement]
# 손익계산서 계산 라인 앵커 (매출총이익 → 영업이익 → … 캐스케이드)
anchor = '(총이익|총손실|영업이익|영업손실|차감전순이익|차감전순손실|순이익|순손실|순손익|총포괄손익|총포괄이익|총포괄손실)$'
# 손익 계산에서 차감(−)으로 취급하는 행 라벨 키워드
pl_minus = '(원가|비용|손실|판매비|법인세)'
# 흐름(기초+변동=기말)에서 차감으로 취급하는 라벨·헤더 키워드
flow_minus = '(처분|감소|상각|지급|환입|사용|제거|폐기|손상)'
# 잔액 흐름이 아니라 원가 산식의 재고 항목 (기초제품 등)
inventory = '^(기초|기말|당기말|전기말)(제품|상품|재고|원재료|재공품|저장품|미착)'
# 합산 관계가 성립하지 않는 평균·비율 성격의 열/행
nonsum_col = '(가격|단가|주당|환율|이자율|할인율|손실율|율\)?$|비율)'

[sections]
# 재무 검산에서 제외하는 구획 (감사시간 표의 합계는 단순합이 아님 등)
skip = '(표지|외부감사|내부회계|감사보고서|검토보고서)'

[units]
# 표 헤더의 단위 표기 패턴 (그룹 1 = 단위 문자열)
pattern = '\(단위\s*:\s*([^)]+)\)'

[units.mult]
# 단위 → 원화 환산 배수
"원" = 1
"천원" = 1000
"백만원" = 1000000
"십억원" = 1000000000

[tolerance]
# footing 검산 허용 오차 (천원 단위 문서의 원단위 절사 관행)
footing = 1
# C4 전역 검색 최소 금액 (우연 일치 방지 — 주당이익 등 소액 제외)
global_search_min = 1000

# ── 회사 프로파일 전용 ──────────────────────────────────────────────
# [[suppress]] — 검토 후 승인된 예외를 억제 (없애지 않고 '억제됨'으로 집계).
#   check = "C2"                  # 필수: 검사 ID
#   where_contains = "주석3"      # 선택: 위치 부분 문자열
#   message_contains = ""         # 선택: 메시지 부분 문자열
#   reason = "전기 심리완료 — 들여쓰기 관례 차이"   # 필수: 사유
