[project]
name = "dsdxlsx"
version = "0.1.0"
description = "DART DSD ↔ XLSX 왕복 변환 도구 — 원본 XML 바이트 보존 방식"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["openpyxl>=3.1"]

[project.scripts]
dsdxlsx = "dsdxlsx.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsdxlsx"]

[tool.uv]
# 소스 수정 시 uv run --no-editable 이 자동 재빌드하도록 (xlwork 리본 연동의 전제 —
# dsdxlsx 업데이트가 재설치 없이 다음 실행에 즉시 반영된다. dsdfoot 와 같은 방식)
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }, { file = "src/**/*.toml" }]
