[project]
name = "dsdxlsx"
version = "0.1.0"
description = "DART DSD ↔ XLSX 왕복 변환 도구 — 원본 XML 바이트 보존 방식"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1"]

[project.scripts]
dsdxlsx = "dsdxlsx.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsdxlsx"]
